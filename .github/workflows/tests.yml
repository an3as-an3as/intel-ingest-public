name: Tests (no deployment)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: intel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d intel_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: sqlite://
      APP_PASSWORD: ''
      ANTHROPIC_API_KEY: ''
      OPENAI_API_KEY: ''
      DEEPSEEK_API_KEY: ''
      GEMINI_API_KEY: ''
      OLLAMA_API_KEY: ''
      OLLAMA_BASE_URL: ''
      NEWSCATCHER_API_KEY: ''
      TEST_POSTGRES_URL: postgresql+psycopg://test:test@localhost:5432/intel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Backend tests including PostgreSQL worker reliability
        run: PYTHONPATH=backend python -m unittest discover -s backend/tests -q
      - name: Frontend tests
        run: node --test frontend/tests/*.test.mjs
      - name: Check development environment boundaries
        run: |
          docker compose --project-name intel-ingest-dev --env-file .env.development.example \
            --file compose.development.yml --profile tests --profile worker config --format json \
            | python scripts/check_development.py
