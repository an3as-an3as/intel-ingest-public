# Standalone development stack. Never combine this with docker-compose.yml.
name: intel-ingest-dev

x-development-app: &development-app
  build: .
  image: intel-ingest-dev:local
  environment:
    APP_ENVIRONMENT: development
    DATABASE_URL: postgresql+psycopg://intel_dev:${DEV_POSTGRES_PASSWORD:?Run scripts/development.sh init first}@db:5432/intel_dev
    APP_PASSWORD: ""
    # Forced empty: production credentials cannot be inherited from the host/.env.
    ANTHROPIC_API_KEY: ""
    OPENAI_API_KEY: ""
    DEEPSEEK_API_KEY: ""
    GEMINI_API_KEY: ""
    OLLAMA_API_KEY: ""
    OLLAMA_BASE_URL: ""
    NEWSCATCHER_API_KEY: ""
    KEYWORD_TRANSLATION_ALLOW_LIVE: "false"
    CLASSIFY_MODEL: claude-haiku-5-5
    SUMMARY_MODEL: claude-sonnet-5-5
    CLASSIFY_CONCURRENCY: "1"
    CLASSIFY_BATCH_SIZE: "5"
    FETCH_ARTICLE_TEXT: "false"
    GDELT_FALLBACK_TO_NEWSCATCHER: "false"
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: intel_dev
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?Run scripts/development.sh init first}
      POSTGRES_DB: intel_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intel_dev -d intel_dev"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    <<: *development-app

  # Docker Desktop cannot publish ports directly from an internal-only network.
  # A fixed reverse proxy exposes the UI, without giving the API internet access.
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${DEV_APP_PORT:-8081}:8080"
    volumes:
      - ./deploy/development-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [default, edge]
    depends_on: [api]
    restart: unless-stopped

  # Not started by the normal development command. No live collection by default.
  worker:
    <<: *development-app
    profiles: [worker]
    command: ["python", "-m", "app.worker"]

  backend-tests:
    profiles: [tests]
    build:
      context: .
      dockerfile: Dockerfile.tests
    image: intel-ingest-dev-tests:local
    environment:
      DATABASE_URL: sqlite://
      APP_PASSWORD: ""
      ANTHROPIC_API_KEY: ""
      NEWSCATCHER_API_KEY: ""
      FETCH_ARTICLE_TEXT: "false"
      KEYWORD_TRANSLATION_ALLOW_LIVE: "false"
    command: ["python", "-m", "unittest", "discover", "-s", "backend/tests", "-q"]

  frontend-tests:
    profiles: [tests]
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - ./frontend:/workspace/frontend:ro
      - ./backend/app/sources/newscatcher_filters.json:/workspace/backend/app/sources/newscatcher_filters.json:ro
    read_only: true
    command: ["sh", "-c", "node --test frontend/tests/*.test.mjs"]

networks:
  default:
    # Server-side external access is disabled in this initial offline sandbox.
    internal: true
  edge:
    # Only the fixed reverse proxy joins this network, never application services.
    internal: false

volumes:
  pgdata:
    name: intel-ingest-dev-pgdata
